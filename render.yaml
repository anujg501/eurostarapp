# Render Blueprint — one setup for the whole back room.
# When you connect this repo as a Blueprint in Render, it creates:
#   1) a PostgreSQL database, and
#   2) the Node/Express web service that runs the API,
# wiring the database URL and secrets automatically.
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: eurostar-db
    databaseName: eurostar
    plan: free

services:
  - type: web
    name: eurostar-api
    runtime: node
    plan: free
    # No region override: the web service must share the database's region for
    # Render's internal (private) DB connection to work, so both use the default.
    branch: claude/github-connection-306nod
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      # Database connection — filled in automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: eurostar-db
          property: connectionString
      # Login secrets — Render generates strong random values.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      # Which website origins may call the API (the live apps on GitHub Pages).
      - key: CORS_ORIGINS
        value: https://eurostargems.com,https://www.eurostargems.com,https://eurostar-api.onrender.com,https://anujg501.github.io,http://localhost:3000,http://localhost:5173
      # OTP stays in test mode until a real SMS provider is added.
      - key: OTP_DEV_MODE
        value: "true"
      # Company UPI details for "pay by QR".
      - key: COMPANY_UPI_ID
        value: eurostar@okhdfcbank
      - key: COMPANY_UPI_NAME
        value: Eurostar Technologies Inc.
      # Mira assistant model. Add ANTHROPIC_API_KEY in the dashboard to enable it.
      - key: ASSISTANT_MODEL
        value: claude-opus-4-8
      # --- Secrets you add in the Render dashboard (Environment tab) ---
      # Live Mira AI:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Real SMS OTP via Twilio (set OTP_DEV_MODE=false above once these are in):
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
