<!DOCTYPE html>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eurostar Gemstones — Wholesale Portal</title>
  <script>
    /* Auth gate. Runs before anything renders to avoid a flash of content.
     *
     * This used to trust a one-time sessionStorage flag the login page set, so
     * anyone who set that flag in devtools could browse without signing in. The
     * flag now only decides whether to paint immediately; the session itself is
     * confirmed against the server, and a token the server rejects is cleared
     * and bounced to the login screen.
     *
     * The API is the real boundary either way — it refuses unauthenticated
     * requests regardless — but the shop should not appear to open for someone
     * who never signed in.
     */
    (function () {
      var LOGIN = 'Eurostar Login.html';
      function toLogin() {
        try {
          localStorage.removeItem('eurostar_token');
          localStorage.removeItem('eurostar_refresh');
          localStorage.removeItem('eurostar_authed');
          localStorage.removeItem('eurostar_user');
          sessionStorage.removeItem('eurostar_enter');
        } catch (e) {}
        location.replace(LOGIN);
      }

      // The access token lives 15 minutes. An expired one is not the end of
      // the session — "keep me signed in" stored a 30-day refresh token, so a
      // page refresh renews the access token silently. Only when the refresh
      // token itself is missing/expired/revoked does the gate sign out.
      function tryRefresh() {
        var rt = null;
        try { rt = localStorage.getItem('eurostar_refresh'); } catch (e) {}
        if (!rt) return toLogin();
        fetch((window.EUROSTAR_API || location.origin) + '/auth/refresh', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ refreshToken: rt }),
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (res.ok && res.d && res.d.accessToken) {
              try { localStorage.setItem('eurostar_token', res.d.accessToken); } catch (e) {}
            } else {
              toLogin();
            }
          })
          .catch(function () { /* offline: keep the app usable */ });
      }

      try {
        // ?enter=1 is used by the mobile preview frame to skip the round-trip.
        if (new URLSearchParams(location.search).get('enter') === '1') return;

        var token = localStorage.getItem('eurostar_token');
        if (!token) return toLogin();

        // Consume the one-time pass so a later refresh re-validates rather than
        // riding on a stale flag.
        try { sessionStorage.removeItem('eurostar_enter'); } catch (e) {}

        // Validate for real. Rendering is not blocked on the round trip — if the
        // token is expired we renew it; only an unrenewable session bounces.
        fetch((window.EUROSTAR_API || location.origin) + '/auth/me', {
          headers: { authorization: 'Bearer ' + token },
        })
          .then(function (r) {
            if (r.status === 401 || r.status === 403) tryRefresh();
          })
          .catch(function () {
            /* offline: keep the app usable — the API still guards every write */
          });
      } catch (e) {}
    })();
  </script>
  <script>
    // Desktop-mode escape hatch for mobile: forces the wide layout by pinning
    // the viewport to a desktop width. Persisted so it survives navigation.
    (function () {
      window.__isDesktopMode = function () {
        try { return localStorage.getItem('eurostar_view_mode') === 'desktop'; } catch (e) { return false; }
      };
      window.__applyViewMode = function () {
        var vp = document.querySelector('meta[name="viewport"]');
        if (!vp) return;
        vp.setAttribute('content', window.__isDesktopMode()
          ? 'width=1280'
          : 'width=device-width, initial-scale=1');
      };
      window.__setViewMode = function (mode) {
        try { localStorage.setItem('eurostar_view_mode', mode); } catch (e) {}
        window.__applyViewMode();
      };
      window.__applyViewMode();
    })();
  </script>

  <script>
    /* When running inside the review preview (an iframe), always fetch a fresh
       copy of the local stylesheets so cached CSS never masks recent edits.
       In production (top-level window) normal caching applies. */
    if (window.self !== window.top) {
      document.querySelectorAll('link[rel="stylesheet"][href^="styles/"]').forEach(function (l) {
        l.href = l.getAttribute('href').split('?')[0] + '?v=' + Date.now();
      });
    }
  </script>

  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    body, html { margin: 0; padding: 0; }

    /* Reclaim the space the native scrollbar reserves — the app is scrolled
       with a thin transparent overlay indicator that only shows while moving. */
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { width: 0; height: 0; }

    #om-scroll-ind {
      position: fixed;
      top: 0; right: 2px;
      width: 4px;
      border-radius: 4px;
      background: rgba(20, 40, 30, 0.28);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 2147483000;
    }
    #om-scroll-ind.is-active { opacity: 1; }
    @media (prefers-color-scheme: dark) {
      #om-scroll-ind { background: rgba(255, 255, 255, 0.35); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="om-scroll-ind" aria-hidden="true"></div>
  <script>
    /* Transparent auto-hiding scroll indicator (overlay — reserves no space). */
    (function () {
      var ind = document.getElementById('om-scroll-ind');
      var hideTimer = null;
      function update() {
        var doc = document.documentElement;
        var vh = window.innerHeight;
        var sh = doc.scrollHeight;
        if (sh <= vh + 4) { ind.classList.remove('is-active'); return; }
        var track = vh - 8;                                   // 4px inset top & bottom
        var thumb = Math.max(28, track * (vh / sh));          // min thumb size
        var top = 4 + (track - thumb) * (window.scrollY / (sh - vh));
        ind.style.height = thumb + 'px';
        ind.style.transform = 'translateY(' + top + 'px)';
        ind.classList.add('is-active');
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(function () { ind.classList.remove('is-active'); }, 700);
      }
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update, { passive: true });
    })();
  </script>
