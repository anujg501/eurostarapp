<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eurostar CRM (Rep) — Mobile Preview</title>
  <style>
    :root { --bezel:#0d0d0f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #171d2e;
      background-image: radial-gradient(120% 80% at 50% 0%, #232c48 0%, #151a2b 60%, #0e1220 100%);
      font-family: -apple-system, system-ui, sans-serif;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px 16px 48px;
    }
    .preview-head {
      text-align: center;
      color: #d9dde9;
    }
    .preview-head h1 {
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 22px;
      margin: 0 0 4px;
      color: #f5e7c4;
    }
    .preview-head p {
      margin: 0;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      color: #99a3c0;
    }

    /* ---------- Phone frame ---------- */
    .phone {
      position: relative;
      width: 402px;
      height: 874px;
      background: var(--bezel);
      border-radius: 56px;
      padding: 14px;
      box-shadow:
        0 0 0 2px #2a2a2e,
        0 0 0 3px #050506,
        0 40px 80px -20px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4);
      flex: 0 0 auto;
    }
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: #FDFAF2;
    }
    /* Dynamic Island */
    .island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 20;
      pointer-events: none;
    }
    /* Status bar overlay */
    .statusbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 54px;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 34px 0;
      font-size: 15px;
      font-weight: 600;
      color: #12241d;
      pointer-events: none;
    }
    .statusbar .icons { display: flex; align-items: center; gap: 7px; }
    .statusbar svg { display: block; }

    iframe {
      position: absolute;
      top: 50px;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - 50px);
      border: 0;
      border-bottom-left-radius: 44px;
      border-bottom-right-radius: 44px;
    }
    /* Home indicator */
    .home-ind {
      position: absolute;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 138px;
      height: 5px;
      border-radius: 3px;
      background: rgba(20,20,20,0.55);
      z-index: 16;
      pointer-events: none;
    }

    .device-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 460px;
    }
    .device-controls button {
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.03em;
      color: #d8e5df;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .device-controls button:hover { background: rgba(255,255,255,0.14); }
  </style>
</head>
<body>
  <div class="preview-head">
    <h1>Eurostar CRM — Sales Rep</h1>
    <p>MOBILE PREVIEW</p>
  </div>

  <div class="phone">
    <div class="phone-screen">
      <div class="island"></div>
      <div class="statusbar">
        <span>9:41</span>
        <div class="icons">
          <!-- signal -->
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <!-- wifi -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2.6 0 5 1 6.8 2.6l1.2-1.4C14.4 1.5 11.6.3 8.5.3S2.6 1.5.5 3.4l1.2 1.4C3.5 3.2 5.9 2.2 8.5 2.2z"/><path d="M8.5 6c1.5 0 2.9.5 3.9 1.5l1.2-1.4C12.3 4.9 10.5 4.2 8.5 4.2s-3.8.7-5.1 1.9L4.6 7.5C5.6 6.5 7 6 8.5 6z"/><path d="M8.5 9.6l2.1-2.4c-.6-.5-1.3-.8-2.1-.8s-1.5.3-2.1.8L8.5 9.6z"/></svg>
          <!-- battery -->
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="1.8" height="4" rx="0.9" fill="currentColor" opacity="0.5"/></svg>
        </div>
      </div>
      <iframe id="app" src="Eurostar CRM.html?role=rep" title="Eurostar CRM (Sales Rep)"></iframe>
      <div class="home-ind"></div>
    </div>
  </div>

  <div class="device-controls">
    <button onclick="var i=document.getElementById('app');i.src='Eurostar CRM.html?role=rep&v='+Date.now();">↻ Reload</button>
    <button onclick="window.open('Eurostar CRM.html?role=rep&v='+Date.now(),'_blank')">Open full screen ↗</button>
  </div>
</body>
</html>
