<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eurostar CRM — Rep check-ins</title>
  <style>
    :root{
      --emerald:#0E5C4A; --emerald-ink:#0A3F33; --emerald-soft:#D9E8E0;
      --paper:#F6F1E6; --surface:#FDFAF2; --border:#D7CCB1;
      --ink:#15130F; --muted:#7A6F5C;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink);}
    header{background:var(--emerald);color:var(--paper);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;}
    header .brand{font-family:Georgia,serif;font-size:20px;font-weight:700;letter-spacing:.5px;}
    header a{color:var(--emerald-soft);text-decoration:none;font-weight:600;font-size:14px;}
    h1{font-family:Georgia,serif;font-weight:500;font-size:24px;margin:0;}
    .sub{color:var(--emerald-soft);font-size:13px;margin-top:2px;}
    .wrap{display:grid;grid-template-columns:1fr 360px;gap:0;height:calc(100vh - 68px);}
    @media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto;}#map{height:340px;}}
    #map{width:100%;height:100%;background:var(--emerald-soft);}
    .side{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:16px;}
    .banner{background:#FBF3D8;border:1px solid #E8D9A6;color:#6B5A1E;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;line-height:1.5;}
    .item{border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:10px;background:var(--paper);}
    .item .top{display:flex;justify-content:space-between;align-items:center;}
    .item .name{font-weight:700;}
    .pill{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:99px;}
    .pill.in{background:var(--emerald-soft);color:var(--emerald-ink);}
    .pill.out{background:#EFE7D4;color:var(--muted);}
    .item .meta{color:var(--muted);font-size:12.5px;margin-top:5px;}
    .item .coords{color:var(--muted);font-size:11px;margin-top:3px;font-family:monospace;}
    .empty{color:var(--muted);padding:20px 4px;text-align:center;}
    .signin{max-width:420px;margin:60px auto;padding:26px;background:var(--surface);border:1px solid var(--border);border-radius:16px;text-align:center;}
    .signin a{display:inline-block;margin-top:14px;background:var(--emerald);color:var(--paper);text-decoration:none;padding:11px 22px;border-radius:99px;font-weight:700;}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Rep check-ins</h1>
      <div class="sub">Field attendance &amp; visits — live from the mobile app</div>
    </div>
    <a href="Eurostar CRM.html">← Back to CRM</a>
  </header>

  <div id="content"></div>

  <script>
  (function () {
    var API = /^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname) ? location.origin : 'https://eurostar-api.onrender.com';
    var token = '';
    try { token = localStorage.getItem('eurostar-admin-token') || ''; } catch (e) {}
    var content = document.getElementById('content');

    if (!token) {
      content.innerHTML = '<div class="signin"><h2>Please sign in first</h2><p style="color:#7A6F5C">Open the CRM and sign in as Admin or Back Office, then come back here.</p><a href="Eurostar CRM.html">Go to CRM sign-in</a></div>';
      return;
    }

    content.innerHTML = '<div class="wrap"><div id="map"></div><div class="side" id="side">Loading check-ins…</div></div>';
    var side = document.getElementById('side');
    var mapEl = document.getElementById('map');
    var checkins = [];
    var mapsKey = null;

    function authFetch(path) {
      return fetch(API + path, { headers: { authorization: 'Bearer ' + token } }).then(function (r) { return r.ok ? r.json() : null; });
    }

    function fmt(at) {
      var d = new Date(at);
      return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function renderList() {
      if (!checkins.length) { side.innerHTML = '<div class="empty">No check-ins yet. Reps check in from the mobile app.</div>'; return; }
      var html = '';
      if (!mapsKey) html += '<div class="banner">Add your <b>Google Maps key</b> (GOOGLE_MAPS_API_KEY in Render) to see these on a map. The list below works either way.</div>';
      checkins.forEach(function (c) {
        html += '<div class="item"><div class="top"><span class="name">' + (c.repName || c.repId || 'Rep') + '</span>' +
          '<span class="pill ' + (c.type === 'in' ? 'in' : 'out') + '">' + (c.type === 'in' ? 'Checked in' : 'Checked out') + '</span></div>' +
          '<div class="meta">' + fmt(c.at) + (c.address ? ' · ' + c.address : '') + '</div>' +
          '<div class="coords">' + c.lat.toFixed(4) + ', ' + c.lng.toFixed(4) + '</div></div>';
      });
      side.innerHTML = html;
    }

    function drawMap() {
      if (!window.google || !window.google.maps) return;
      var center = checkins.length ? { lat: checkins[0].lat, lng: checkins[0].lng } : { lat: 19.076, lng: 72.8777 };
      var map = new google.maps.Map(mapEl, { center: center, zoom: checkins.length ? 11 : 5, mapTypeControl: false, streetViewControl: false });
      var bounds = new google.maps.LatLngBounds();
      checkins.forEach(function (c) {
        var pos = { lat: c.lat, lng: c.lng };
        var m = new google.maps.Marker({ position: pos, map: map, title: (c.repName || 'Rep') + ' — ' + c.type, label: c.type === 'in' ? '↓' : '↑' });
        var iw = new google.maps.InfoWindow({ content: '<b>' + (c.repName || 'Rep') + '</b><br>' + (c.type === 'in' ? 'Checked in' : 'Checked out') + '<br>' + fmt(c.at) + (c.address ? '<br>' + c.address : '') });
        m.addListener('click', function () { iw.open(map, m); });
        bounds.extend(pos);
      });
      if (checkins.length > 1) map.fitBounds(bounds);
    }

    Promise.all([authFetch('/reps/checkins'), authFetch('/reps/maps-key')]).then(function (res) {
      checkins = Array.isArray(res[0]) ? res[0] : [];
      mapsKey = res[1] && res[1].key;
      renderList();
      if (mapsKey) {
        window.__egMapReady = drawMap;
        var s = document.createElement('script');
        s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(mapsKey) + '&callback=__egMapReady';
        s.async = true; document.head.appendChild(s);
      } else {
        mapEl.innerHTML = '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#0A3F33;padding:20px;text-align:center;font-size:14px;">Add your Google Maps key in Render<br>to see check-ins on a map.</div>';
      }
    });
  })();
  </script>
</body>
</html>
