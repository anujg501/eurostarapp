  <script>
    /* Auth gate — if not signed in, bounce to the login screen and remember
       where to return. Runs before anything renders to avoid a flash. */
    (function () {
      try {
        // Always return to the login screen on a fresh load / refresh. The
        // login sets a one-time 'eurostar_enter' flag right before redirecting
        // here; we consume it once so this load proceeds, then clear it so the
        // next refresh goes back to login.
        // A ?enter=1 URL flag (used by the mobile preview frame) bypasses the
        // gate so the app opens directly without the login round-trip.
        var qs = new URLSearchParams(location.search);
        if (qs.get('enter') === '1') {
          // proceed directly
        } else if (sessionStorage.getItem('eurostar_enter') === '1') {
          sessionStorage.removeItem('eurostar_enter');
        } else {
          var here = (location.pathname.split('/').pop()) || 'Eurostar Sales website.html';
          location.replace('Eurostar Login.html?next=' + encodeURIComponent(here));
        }
      } catch (e) {}
    })();
  </script>
  <script>
    // Desktop-mode escape hatch for mobile: forces the wide layout by pinning
    // the viewport to a desktop width. Persisted so it survives navigation.
    (function () {
      window.__isDesktopMode = function () {
        try { return localStorage.getItem('eurostar_view_mode') === 'desktop'; } catch (e) { return false; }
      };
      window.__applyViewMode = function () {
        var vp = document.querySelector('meta[name="viewport"]');
        if (!vp) return;
        vp.setAttribute('content', window.__isDesktopMode()
          ? 'width=1280'
          : 'width=device-width, initial-scale=1');
      };
      window.__setViewMode = function (mode) {
        try { localStorage.setItem('eurostar_view_mode', mode); } catch (e) {}
        window.__applyViewMode();
      };
      window.__applyViewMode();
    })();
  </script>

  <script>
    /* When running inside the review preview (an iframe), always fetch a fresh
       copy of the local stylesheets so cached CSS never masks recent edits.
       In production (top-level window) normal caching applies. */
    if (window.self !== window.top) {
      document.querySelectorAll('link[rel="stylesheet"][href^="styles/"]').forEach(function (l) {
        l.href = l.getAttribute('href').split('?')[0] + '?v=' + Date.now();
      });
    }
  </script>

  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    body, html { margin: 0; padding: 0; }

    /* Reclaim the space the native scrollbar reserves — the app is scrolled
       with a thin transparent overlay indicator that only shows while moving. */
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { width: 0; height: 0; }

    #om-scroll-ind {
      position: fixed;
      top: 0; right: 2px;
      width: 4px;
      border-radius: 4px;
      background: rgba(20, 40, 30, 0.28);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 2147483000;
    }
    #om-scroll-ind.is-active { opacity: 1; }
    @media (prefers-color-scheme: dark) {
      #om-scroll-ind { background: rgba(255, 255, 255, 0.35); }
    }
  </style>

<body>
  <div id="root"></div>
  <div id="om-scroll-ind" aria-hidden="true"></div>
  <script>
    /* Transparent auto-hiding scroll indicator (overlay — reserves no space). */
    (function () {
      var ind = document.getElementById('om-scroll-ind');
      var hideTimer = null;
      function update() {
        var doc = document.documentElement;
        var vh = window.innerHeight;
        var sh = doc.scrollHeight;
        if (sh <= vh + 4) { ind.classList.remove('is-active'); return; }
        var track = vh - 8;                                   // 4px inset top & bottom
        var thumb = Math.max(28, track * (vh / sh));          // min thumb size
        var top = 4 + (track - thumb) * (window.scrollY / (sh - vh));
        ind.style.height = thumb + 'px';
        ind.style.transform = 'translateY(' + top + 'px)';
        ind.classList.add('is-active');
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(function () { ind.classList.remove('is-active'); }, 700);
      }
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update, { passive: true });
    })();
  </script>
